services:

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: logistics-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - logistics-network

  # ============================================================
  # API GATEWAY
  # ============================================================
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    container_name: logistics-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}

      BookingApi__BaseUrl: http://booking-api:8080
      ContainerApi__BaseUrl: http://container-api:8080
      NotificationApi__BaseUrl: http://notification-api:8080
    depends_on:
      booking-api:
        condition: service_healthy
      container-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-network

  # ============================================================
  # BOOKING SERVICE
  # ============================================================
  booking-api:
    build:
      context: .
      dockerfile: infrastructure/docker/booking.Dockerfile
    container_name: logistics-booking-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=booking-db;Port=5432;Database=${BOOKING_DB_NAME};Username=${BOOKING_DB_USER};Password=${BOOKING_DB_PASSWORD}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-network

  # ============================================================
  # CONTAINER SERVICE
  # ============================================================
  container-api:
    build:
      context: .
      dockerfile: infrastructure/docker/container.Dockerfile
    container_name: logistics-container-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=container-db;Port=5432;Database=${CONTAINER_DB_NAME};Username=${CONTAINER_DB_USER};Password=${CONTAINER_DB_PASSWORD}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      container-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-network

  # ============================================================
  # NOTIFICATION SERVICE
  # ============================================================
  notification-api:
    build:
      context: .
      dockerfile: infrastructure/docker/notification.Dockerfile
    container_name: logistics-notification-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=notification-db;Port=5432;Database=${NOTIFICATION_DB_NAME};Username=${NOTIFICATION_DB_USER};Password=${NOTIFICATION_DB_PASSWORD}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - logistics-network

  # ============================================================
  # BOOKING DATABASE
  # ============================================================
  booking-db:
    image: postgres:16-alpine
    container_name: logistics-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME}
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BOOKING_DB_USER} -d ${BOOKING_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - logistics-network

  # ============================================================
  # CONTAINER DATABASE
  # ============================================================
  container-db:
    image: postgres:16-alpine
    container_name: logistics-container-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONTAINER_DB_NAME}
      POSTGRES_USER: ${CONTAINER_DB_USER}
      POSTGRES_PASSWORD: ${CONTAINER_DB_PASSWORD}
    volumes:
      - container-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CONTAINER_DB_USER} -d ${CONTAINER_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - logistics-network

  # ============================================================
  # NOTIFICATION DATABASE
  # ============================================================
  notification-db:
    image: postgres:16-alpine
    container_name: logistics-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - logistics-network

  # ============================================================
  # RABBITMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logistics-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistics-network

# ==============================================================
# NETWORKS
# ==============================================================

networks:
  logistics-network:
    driver: bridge

# ==============================================================
# VOLUMES
# ==============================================================

volumes:
  booking-db-data:
  container-db-data:
  notification-db-data:
  rabbitmq-data:
